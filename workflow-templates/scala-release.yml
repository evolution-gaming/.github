name: Publish Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    uses: evolution-gaming/scala-github-actions/.github/workflows/release.yml@2a389d2a5f4b093e72f738464bd7472bd0c3b4b8 # v6
    # the release job publishes to Artifactory, so it does need the org secrets
    secrets: inherit
